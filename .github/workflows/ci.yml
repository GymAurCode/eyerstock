name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # better-sqlite3 is a native module; it needs a prebuilt binary for the
      # Node ABI. If prebuilds are unavailable this job fails at install and
      # the MSVC step below would be needed instead.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  package:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Signing is skipped when no certificate is configured; the installer is
      # still produced so packaging regressions are caught.
      - name: Build installer
        run: npm run dist

      - name: Verify installer
        run: node scripts/verify-installer.js

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: minha-inventory-installer
          path: release/*.exe
          if-no-files-found: error