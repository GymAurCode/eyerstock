name: Release

# Publishing an update.
#
# The application checks this repository's releases for a newer version, so a
# release is not just the installer: it is the installer PLUS the files the
# updater reads to decide whether there is anything to download - the update
# manifest (`latest.yml`) and its blockmap. A GitHub release with only the
# .exe attached looks complete and updates nothing, which is the failure this
# workflow exists to make impossible.
#
# To publish an update:
#
#   1. bump the version in package.json and add a CHANGELOG entry
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# The tag has to match the version in package.json, or the updater will offer
# the shop a version that is older than the one it is running.

on:
  push:
    tags: ["v*"]
  # A release can also be cut from a tag that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The version in package.json and the tag have to agree. The updater
      # compares the version in the release against the version it is running,
      # so a release tagged v0.3.0 that carries 0.2.0 would offer every shop
      # a downgrade.
      - name: Check the tag against the version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Error "The tag '$tag' does not match the version '$version' in package.json."
            exit 1
          }
          Write-Output "Releasing $version as $tag"

      # Signing credentials come from the repository secrets when they are
      # there. Without them the build is unsigned: it still works, but Windows
      # SmartScreen warns every shop that installs it.
      - name: Build the installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if (-not $env:CSC_LINK -and -not $env:WIN_CSC_LINK) {
            Write-Output "No signing credentials in the repository secrets: building unsigned."
            $env:EYERSTOCK_REQUIRE_SIGNING = "false"
          }
          npm run release:check
          npm run dist

      # The updater needs the manifest and the blockmap next to the installer.
      # They are generated by electron-builder and are the files it reads to
      # decide what to download and how to verify it.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $assets = @(Get-ChildItem release -File |
            Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" })

          if ($assets.Count -eq 0) {
            Write-Error "No release files were produced."
            exit 1
          }

          $assets | ForEach-Object { Write-Output "Attaching $($_.Name)" }

          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The release already exists: replace its files rather than
            # failing, so a re-run of a broken build can be repeated.
            gh release upload $env:TAG $assets.FullName --clobber
          } else {
            gh release create $env:TAG $assets.FullName --title $env:TAG --generate-notes
          }

          Write-Output "Published $env:TAG"
          gh release view $env:TAG
